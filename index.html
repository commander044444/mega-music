<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MEGA MUSIC — پلتفرم موسیقی پرمیوم با طراحی شیشه‌ای سیاه و قرمز">
  <title>MEGA MUSIC</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Config warning (shown when Supabase not configured) -->
  <div id="configBanner" class="config-banner hidden">
    Phase 1: کاتالوگ محلی فعال است. برای اتصال به Supabase مقادیر <code>config.js</code> را تنظیم کنید.
  </div>

  <!-- Header -->
  <header class="header">
    <a href="index.html" class="logo-link" aria-label="MEGA MUSIC">
      <img src="logo.svg" alt="MEGA MUSIC" width="160" height="36">
    </a>

    <nav class="nav" aria-label="Main">
      <button type="button" class="nav-btn active" data-view="home">
        <svg width="18" height="18"><use href="icons.svg#icon-home"></use></svg>
        خانه
      </button>
      <button type="button" class="nav-btn" data-view="discover">
        <svg width="18" height="18"><use href="icons.svg#icon-discover"></use></svg>
        کشف
      </button>
      <button type="button" class="nav-btn" data-view="library">
        <svg width="18" height="18"><use href="icons.svg#icon-library"></use></svg>
        کتابخانه
      </button>
    </nav>

    <div class="search-wrap">
      <svg class="search-icon" width="18" height="18"><use href="icons.svg#icon-search"></use></svg>
      <input type="search" id="searchInput" class="search-input" placeholder="جستجوی آهنگ، هنرمند، آلبوم..." autocomplete="off" aria-label="Search">
    </div>

    <div class="header-actions">
      <button type="button" class="icon-btn" aria-label="Profile" title="پروفایل (فاز بعدی)">
        <svg><use href="icons.svg#icon-user"></use></svg>
      </button>
      <button type="button" class="icon-btn" aria-label="Settings" title="تنظیمات (فاز بعدی)">
        <svg><use href="icons.svg#icon-settings"></use></svg>
      </button>
    </div>
  </header>

  <!-- Main content -->
  <main class="main">
    <section class="section">
      <div class="section-header">
        <h1 id="sectionTitle" class="section-title">کشف موسیقی</h1>
      </div>
      <div id="trackGrid" class="track-grid" role="list"></div>
      <div id="emptyState" class="state-msg hidden">
        <h3>نتیجه‌ای یافت نشد</h3>
        <p>عبارت دیگری جستجو کنید یا کاتالوگ را مرور کنید.</p>
      </div>
    </section>
  </main>

  <!-- Persistent player -->
  <div class="player" role="region" aria-label="Music player">
    <div class="player-left">
      <img id="playerArt" class="player-art" src="" alt="" width="56" height="56">
      <div class="player-meta">
        <div id="playerTitle" class="player-title">هیچ آهنگی انتخاب نشده</div>
        <div id="playerArtist" class="player-artist">—</div>
      </div>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button type="button" id="btnPrev" class="ctrl-btn" aria-label="Previous">
          <svg><use href="icons.svg#icon-prev"></use></svg>
        </button>
        <button type="button" id="btnPlay" class="ctrl-btn primary" aria-label="Play">
          <svg><use href="icons.svg#icon-play"></use></svg>
        </button>
        <button type="button" id="btnNext" class="ctrl-btn" aria-label="Next">
          <svg><use href="icons.svg#icon-next"></use></svg>
        </button>
      </div>
      <div class="progress-wrap">
        <span id="timeElapsed" class="time">0:00</span>
        <input type="range" id="progress" class="progress" min="0" max="100" value="0" aria-label="Seek">
        <span id="timeTotal" class="time">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <div class="volume-wrap">
        <button type="button" id="btnVolume" class="ctrl-btn" aria-label="Volume">
          <svg><use href="icons.svg#icon-volume"></use></svg>
        </button>
        <input type="range" id="volume" class="volume" min="0" max="100" value="80" aria-label="Volume level">
      </div>
    </div>
  </div>

  <!-- Shared audio element -->
  <audio id="mainAudio" preload="metadata"></audio>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
